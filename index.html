<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceff3;
    --card: #ffffff;
    --ink: #14181f;
    --muted: #596273;
    --line: #d5dae1;
    --accent: #1f5f5b;
    --c-prog: #2f5fd0;
    --c-game: #2a8a4a;
    --c-poem: #b5416a;
    --c-misc: #b0701f;
    --c-link: #596273;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0e11; --card: #171c21; --ink: #e6eaee; --muted: #8d97a5; --line: #242b33; --accent: #5fc2b8;
      --c-prog: #7aa2ff; --c-game: #6fd08c; --c-poem: #f08aae; --c-misc: #e8b56a; --c-link: #9aa4b2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0e11; --card: #171c21; --ink: #e6eaee; --muted: #8d97a5; --line: #242b33; --accent: #5fc2b8;
    --c-prog: #7aa2ff; --c-game: #6fd08c; --c-poem: #f08aae; --c-misc: #e8b56a; --c-link: #9aa4b2;
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1rem 2rem; }

  header { padding: 0 .25rem 1.75rem; }
  h1 { font: 600 clamp(2rem, 6vw, 2.8rem)/1.1 var(--serif); letter-spacing: -.02em; margin: 0 0 .5rem; }
  header p { font: 400 1.1rem/1.55 var(--serif); color: var(--muted); margin: 0; max-width: 30rem; }

  .group { font: 600 1.15rem var(--serif); margin: 1.75rem .25rem .75rem; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }

  /* Плитка */
  .tile {
    display: flex; flex-direction: column; justify-content: space-between; gap: 1.25rem;
    min-height: 9.5rem; padding: 1rem 1.1rem 1.1rem;
    background: var(--card); color: inherit; text-decoration: none;
    border-radius: 20px;
  }
  .tile.wide { grid-column: 1 / -1; min-height: 8rem; }
  .tile:hover .name::after { transform: translateX(3px); }
  .name { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: .98rem; color: var(--c); }
  .name::before { content: ""; width: .7rem; height: .7rem; border-radius: 50%; background: var(--c); flex: none; }
  .name::after { content: "›"; margin-left: auto; color: var(--muted); font-size: 1.3rem; line-height: 1; transition: transform .15s; }
  .big { font: 600 1.6rem/1.15 var(--serif); letter-spacing: -.01em; }
  .sub { display: block; margin-top: .25rem; font-size: .88rem; color: var(--muted); }
  .quote { font: italic 400 1.2rem/1.5 var(--serif); }
  .prog { --c: var(--c-prog); } .game { --c: var(--c-game); } .poem { --c: var(--c-poem); } .misc { --c: var(--c-misc); } .link { --c: var(--c-link); }

  .tile.compact { min-height: 6.5rem; }
  @media (prefers-reduced-motion: reduce) { .name::after { transition: none; } }
  @media (max-width: 26rem) { .big { font-size: 1.35rem; } .tile { padding: .9rem; } }

  footer { margin: 2.5rem .25rem 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="name">ПСЕВДОНИМ</h1>
    <p id="about"></p>
  </header>

  <div id="app"></div>

  <noscript>
    <p><a href="programs.html">Программы</a> · <a href="games.html">Игры</a> · <a href="poems.html">Стихи</a> · <a href="other.html">Прочее</a></p>
  </noscript>

  <footer>© <span id="year"></span> <span id="foot-name"></span></footer>
</div>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // «3 дня назад» и т. п.
  function plural(n, one, few, many) {
    var m = n % 100, d = n % 10;
    if (m > 10 && m < 20) return many;
    if (d === 1) return one;
    if (d > 1 && d < 5) return few;
    return many;
  }
  function ago(iso) {
    var sec = (Date.now() - new Date(iso).getTime()) / 1000, n;
    if (sec < 3600) { n = Math.max(1, Math.round(sec / 60)); return n + " " + plural(n, "минуту", "минуты", "минут") + " назад"; }
    if (sec < 86400) { n = Math.round(sec / 3600); return n + " " + plural(n, "час", "часа", "часов") + " назад"; }
    if (sec < 2592000) { n = Math.round(sec / 86400); return n + " " + plural(n, "день", "дня", "дней") + " назад"; }
    if (sec < 31536000) { n = Math.round(sec / 2592000); return n + " " + plural(n, "месяц", "месяца", "месяцев") + " назад"; }
    n = Math.round(sec / 31536000); return n + " " + plural(n, "год", "года", "лет") + " назад";
  }

  // Последний коммит репозитория; результат хранится 10 минут, чтобы не упереться в лимит GitHub
  function lastCommit(repo) {
    var key = "gh:" + repo, cached = null;
    try { cached = JSON.parse(sessionStorage.getItem(key)); } catch (e) {}
    if (cached && Date.now() - cached.t < 600000) return Promise.resolve(cached.v);
    return fetch("https://api.github.com/repos/" + repo + "/commits?per_page=1")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (list) {
        var c = list[0].commit;
        var v = { date: c.committer.date, msg: c.message.split("\n")[0] };
        try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), v: v })); } catch (e) {}
        return v;
      });
  }

  function tile(t) {
    var a = el("a", "tile " + (t.color || "link") + (t.wide ? " wide" : "") + (t.compact ? " compact" : ""));
    a.href = t.href || "#";
    a.appendChild(el("span", "name", t.title));
    var body = el("span");
    if (t.quote) body.appendChild(el("span", "quote", t.quote));
    if (t.big) body.appendChild(el("span", "big", t.big));
    var sub = el("span", "sub", t.sub || "");
    body.appendChild(sub);
    a.appendChild(body);
    if (t.repo) {
      lastCommit(t.repo).then(function (c) {
        sub.textContent = "Обновлено " + ago(c.date) + " · " + c.msg;
      }).catch(function () { /* при ошибке остаётся текст из data.json */ });
    }
    return a;
  }

  fetch("data.json")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById("name").textContent = d.name;
      document.getElementById("foot-name").textContent = d.name;
      document.getElementById("about").textContent = d.about;
      var app = document.getElementById("app");
      d.groups.forEach(function (g) {
        app.appendChild(el("h2", "group", g.title));
        var grid = el("div", "grid");
        g.tiles.forEach(function (t) { t.compact = g.compact; grid.appendChild(tile(t)); });
        app.appendChild(grid);
      });
    })
    .catch(function () {
      document.getElementById("app").textContent = "Не удалось загрузить данные сайта (data.json).";
    });
</script>
</body>
</html>
