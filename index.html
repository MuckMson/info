<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#2a3038" media="(prefers-color-scheme: dark)">

<meta name="description" content="MuckMson: личный сайт. Стихи, игры на Unity и студия Mucking Games.">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceff3;
    --card: #ffffff;
    --ink: #14181f;
    --muted: #596273;
    --line: #d5dae1;
    --accent: #f4fffe;
    --on-accent: #705757;
    --c-game: #2a8a4a;
    --c-poem: #b5416a;
    --c-link: #596273;
    --c-live: #b0701f;    /* проект в работе */
    --c-frozen: #2f6fd0;  /* проект заморожен */
    --c-cancel: #c23b32;  /* проект отменён */
    /* Палитра фона: тёмно-бирюзовый → бирюзовый → светло-бирюзовый → белый → светло-фиолетовый → фиолетовый → тёмно-фиолетовый */
    --t1: #26bda1; --t2: #1fa59c; --t3: #a7ffe9; --t4: #ffffff; --t5: #b49fe8; --t6: #8b5cf0; --t7: #5e3b9e;
    --veil-weak: color-mix(in srgb, var(--bg) 26%, transparent);   /* по краям экрана фон ярче */
    --veil-strong: color-mix(in srgb, var(--bg) 70%, transparent); /* под текстом спокойнее */
    --shadow: 0 6px 18px rgba(20,24,31,.14), 0 1px 3px rgba(20,24,31,.10);
    --shadow-hover: 0 10px 24px rgba(20,24,31,.20), 0 2px 5px rgba(20,24,31,.12);
    --shadow-btn: 0 3px 10px rgba(20,24,31,.18), 0 1px 2px rgba(20,24,31,.12);
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a3038; --card: #373f4a; --ink: #eef1f5; --muted: #a9b3c1; --line: #4a5461; --accent: #324b48; --on-accent: #f1f8ff;
      --c-game: #6fd08c; --c-poem: #f08aae; --c-link: #9aa4b2;
      --c-live: #e8b56a; --c-frozen: #7ab4ff; --c-cancel: #ff7f75;
      --veil-weak: color-mix(in srgb, var(--bg) 60%, transparent); --veil-strong: color-mix(in srgb, var(--bg) 85%, transparent);
      --shadow: 0 6px 18px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.25);
      --shadow-hover: 0 10px 24px rgba(0,0,0,.40), 0 2px 5px rgba(0,0,0,.3);
      --shadow-btn: 0 3px 10px rgba(0,0,0,.38), 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #e1d5d5; --card: #566273; --ink: #eef1f5; --muted: #a9b3c1; --line: #4a5461; --accent: #9dc9c4; --on-accent: #2d3034;
    --c-game: #6fd08c; --c-poem: #f08aae; --c-link: #9aa4b2;
    --c-live: #e8b56a; --c-frozen: #7ab4ff; --c-cancel: #ff7f75;
    --veil-weak: color-mix(in srgb, var(--bg) 60%, transparent); --veil-strong: color-mix(in srgb, var(--bg) 85%, transparent);
    --shadow: 0 6px 18px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.25);
    --shadow-hover: 0 10px 24px rgba(0,0,0,.40), 0 2px 5px rgba(0,0,0,.3);
    --shadow-btn: 0 3px 10px rgba(0,0,0,.38), 0 1px 2px rgba(0,0,0,.3);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  /* Анимированный фон: две слои диагональных полос плывут навстречу друг другу */
  html::before, body::before, body::after { content: ""; position: fixed; inset: -800px; z-index: -1; pointer-events: none; }
  html::before {
    background: repeating-linear-gradient(115deg, var(--t1) 0, var(--t2) 100px, var(--t3) 200px, var(--t4) 300px, var(--t5) 400px, var(--t6) 500px, var(--t7) 600px, var(--t1) 700px);
    animation: drift-a 5s linear infinite;
  }
  body::before { /* вуаль: делает центр колонки спокойнее, чтобы текст читался */
    inset: -800px 0;
    background: linear-gradient(90deg, var(--veil-weak) 0, var(--veil-strong) calc(50% - 22rem), var(--veil-strong) calc(50% + 22rem), var(--veil-weak) 100%);
  }
  body::after { /* мягкие полосы поверх, идут в другую сторону */
    background: repeating-linear-gradient(65deg, var(--t7) 0, var(--t6) 100px, var(--t5) 200px, var(--t4) 300px, var(--t3) 400px, var(--t2) 500px, var(--t1) 600px, var(--t7) 700px);
    -webkit-mask-image: repeating-linear-gradient(65deg, transparent 0, #000 175px, transparent 350px);
            mask-image: repeating-linear-gradient(65deg, transparent 0, #000 175px, transparent 350px);
    opacity: .28;
    animation: drift-b 70s linear infinite;
  }
  @keyframes drift-a { to { transform: translate3d(634.4px, 295.8px, 0); } }
  @keyframes drift-b { from { transform: translate3d(634.4px, -295.8px, 0); } to { transform: translate3d(0, 0, 0); } }
  @media (prefers-reduced-motion: reduce) { html::before, body::after { animation: none; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1rem 2rem; }

  header { padding: 0 .25rem 0.1rem; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0 0 .6rem; }
  h1 { font: 600 clamp(2.2rem, 7vw, 3.2rem)/1.1 var(--serif); letter-spacing: -.02em; margin: 0; }
  .socials { display: flex; gap: .5rem; flex: none; }
  .social {
    display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border-radius: 50%;
    background: var(--card); color: var(--ink); box-shadow: var(--shadow-btn); transition: color .15s, transform .15s, box-shadow .15s;
  }
  .social svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }
  .social:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .social:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  header p { font: 400 1.1rem/1.55 var(--serif); color: var(--muted); margin: 0 0 1.25rem; max-width: 30rem; }
  .btn {
    display: inline-block; padding: .7rem 1.2rem; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none;
    box-shadow: var(--shadow-btn); transition: filter .15s, transform .15s, box-shadow .15s;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: var(--shadow-hover); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem; margin: 0 .25rem .5rem 0; }
  .btn { text-align: center; }
  .actions:empty { display: none; }

  .group { font: 600 1.15rem var(--serif); margin: 1.75rem .25rem .75rem; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }

  /* Плитка (ссылка) и карточка (без ссылки) — один и тот же вид */
  .tile, .card {
    background: color-mix(in srgb, var(--card) 85%, transparent); color: inherit; border-radius: 20px; padding: 1rem 1.1rem 1.1rem;
    box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s;
  }
  .tile:hover, .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .tile {
    display: flex; flex-direction: column; justify-content: space-between; gap: 1.25rem;
    min-height: 9.5rem; text-decoration: none;
  }
  .tile.wide { grid-column: 1 / -1; min-height: 8rem; }
  .tile.compact { min-height: 6.5rem; }
  .tile:hover .name::after { transform: translateX(3px); }
  .name { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: .98rem; color: var(--c); }
  .name::before { content: ""; width: .7rem; height: .7rem; border-radius: 50%; background: var(--c); flex: none; }
  .tile .name::after { content: "›"; margin-left: auto; color: var(--muted); font-size: 1.3rem; line-height: 1; transition: transform .15s; }
  .big { font: 600 1.6rem/1.15 var(--serif); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .sub { display: block; margin-top: .25rem; font-size: .88rem; color: var(--muted); }
  .quote { display: block; font: italic 400 1.2rem/1.55 var(--serif); white-space: pre-line; }
  .game { --c: var(--c-game); } .poem { --c: var(--c-poem); } .link { --c: var(--c-link); } .me { --c: var(--accent); } .proj { --c: var(--c-live); }

  /* Обо мне */
  .card .name { margin-bottom: .75rem; }
  .prose { font: 400 1.05rem/1.65 var(--serif); white-space: pre-line; max-width: 36rem; }

  /* Проекты */
  .projects { display: grid; gap: 1.1rem; }
  .p-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .p-name { font: 600 1.05rem var(--serif); }
  .p-state { font-size: .85rem; font-weight: 600; color: var(--s); white-space: nowrap; }
  .bar { height: .5rem; margin-top: .45rem; background: color-mix(in srgb, var(--line) 55%, transparent); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: var(--w); background: var(--s); opacity: .6; border-radius: 999px; }
  .p-note { margin-top: .35rem; font-size: .88rem; color: var(--muted); }
  .active { --s: var(--c-live); } .frozen { --s: var(--c-frozen); } .cancelled { --s: var(--c-cancel); }
  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: .6rem; height: .6rem; margin-right: .4rem; border-radius: 50%; background: var(--s); }

  /* Музыка: сюда попадает код встраивания Apple Music */
  .embeds iframe { display: block; width: 100% !important; max-width: 100% !important; margin: 0 0 .75rem; border: 0; border-radius: 16px !important; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
  .embeds iframe:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

  @media (prefers-reduced-motion: reduce) { .tile, .card, .btn, .social, .embeds iframe, .tile .name::after { transition: none; } .tile:hover, .card:hover, .btn:hover, .social:hover, .embeds iframe:hover { transform: none; } }
  @media (max-width: 26rem) { .big { font-size: 1.35rem; } .tile, .card { padding: .9rem; } }

  footer { margin: 2.5rem .25rem 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <h1 id="name">MuckMson</h1>
      <nav class="socials" aria-label="Соцсети">
        <!-- TODO: замени ТВОЙ-НИК на свой ник в GitHub -->
        <a class="social" href="https://github.com/ТВОЙ-НИК" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        </a>
      </nav>
    </div>
    <p id="about"></p>
    <div class="actions" id="actions"></div>
  </header>

  <div id="app"></div>

  <noscript>
    <p><a href="https://t.me/muckpoem">Стихи</a> · <a href="https://t.me/muckinggames">Mucking Games</a> · <a href="https://t.me/muckmson">Telegram</a></p>
  </noscript> 

  <footer>© <span id="year"></span> <span id="foot-name"></span></footer>
</div>

<!--
  МУЗЫКА. Вставь сюда код встраивания из Apple Music (в Apple Music: «⋯» у песни или альбома →
  «Поделиться» → «Скопировать код для встраивания»). Можно вставить несколько iframe подряд.
  Раздел «Музыка» на сайте появится сам, как только внутри будет хотя бы один iframe.
  Пока iframe нет, раздел скрыт.
-->
<template id="music">
  <!-- ВСТАВЬ КОД ВСТРАИВАНИЯ НИЖЕ -->
<iframe allow="autoplay *; encrypted-media *;" frameborder="0" height="150" style="width:100%;max-width:660px;overflow:hidden;background:transparent;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" src="https://embed.music.apple.com/tr/album/dark-night-kara/1678598288?i=1678598645"></iframe>

  <!-- ВСТАВЬ КОД ВСТРАИВАНИЯ ВЫШЕ -->
</template>

<!-- Аналитика без cookies. Зарегистрируйся на goatcounter.com, замени КОД и раскомментируй:
<script data-goatcounter="https://КОД.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
-->

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function tile(t) {
    var a = el("a", "tile " + (t.color || "link") + (t.wide ? " wide" : "") + (t.compact ? " compact" : ""));
    a.href = t.href || "#";
    a.appendChild(el("span", "name", t.title));
    var body = el("span");
    if (t.quote) body.appendChild(el("span", "quote", t.quote));
    if (t.big) body.appendChild(el("span", "big", t.big));
    if (t.sub) body.appendChild(el("span", "sub", t.sub));
    a.appendChild(body);
    return a;
  }

  var STATUS = { active: "В работе", frozen: "Заморожен", cancelled: "Отменён" };

  function projectsCard(p) {
    var card = el("div", "card");
    var list = el("div", "projects");
    p.items.forEach(function (it) {
      var st = STATUS[it.status] ? it.status : "active";
      var pct = Math.max(0, Math.min(100, Number(it.progress) || 0));
      var row = el("div", st);
      var head = el("div", "p-head");
      head.appendChild(el("span", "p-name", it.name));
      head.appendChild(el("span", "p-state", STATUS[st] + " · " + pct + "%"));
      row.appendChild(head);
      var bar = el("div", "bar");
      bar.setAttribute("role", "progressbar");
      bar.setAttribute("aria-label", it.name);
      bar.setAttribute("aria-valuemin", "0");
      bar.setAttribute("aria-valuemax", "100");
      bar.setAttribute("aria-valuenow", pct);
      var fill = el("i");
      fill.style.setProperty("--w", pct + "%");
      bar.appendChild(fill);
      row.appendChild(bar);
      if (it.note) row.appendChild(el("div", "p-note", it.note));
      list.appendChild(row);
    });
    card.appendChild(list);
    var legend = el("div", "legend");
    ["active", "frozen", "cancelled"].forEach(function (k) {
      var s = el("span", k, STATUS[k]);
      legend.appendChild(s);
    });
    card.appendChild(legend);
    return card;
  }

  fetch("data.json")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById("name").textContent = d.name;
      document.getElementById("foot-name").textContent = d.name;
      document.getElementById("about").textContent = d.about;

      var actions = document.getElementById("actions");
      (d.buttons || []).forEach(function (b) {
        var a = el("a", "btn", b.label);
        a.href = b.href || "#";
        actions.appendChild(a);
      });


      var app = document.getElementById("app");

      if (d.aboutBlock) {
        app.appendChild(el("h2", "group", d.aboutBlock.title));
        var c = el("div", "card me");
        c.appendChild(el("div", "prose", d.aboutBlock.text));
        app.appendChild(c);
      }

      if (d.latest) {
  app.appendChild(el("h2", "group", d.latest.title));
  var g = el("div", "grid");
  var latestTile = tile({
    title: "Telegram-канал", color: "poem", wide: true,
    quote: "…", sub: d.latest.date, href: d.latest.href
  });
  g.appendChild(latestTile);
  app.appendChild(g);

  fetch(d.latest.textFile)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (txt) {
      latestTile.querySelector(".quote").textContent = txt.trim();
    })
    .catch(function () {
      latestTile.querySelector(".quote").textContent = "Читать в Telegram";
    });
}

      var music = document.getElementById("music");
      if (music && music.content.querySelector("iframe")) {
        app.appendChild(el("h2", "group", "Музыка"));
        var box = el("div", "embeds");
        box.appendChild(music.content.cloneNode(true));
        app.appendChild(box);
      }

      if (d.projects && d.projects.items.length) {
        app.appendChild(el("h2", "group", d.projects.title));
        app.appendChild(projectsCard(d.projects));
      }

      d.groups.forEach(function (gr) {
        app.appendChild(el("h2", "group", gr.title));
        var grid = el("div", "grid");
        gr.tiles.forEach(function (t) { t.compact = gr.compact; grid.appendChild(tile(t)); });
        app.appendChild(grid);
      });
    })
    .catch(function () {
      document.getElementById("app").textContent = "Не удалось загрузить данные сайта (data.json).";
    });
</script>
</body>
</html>
